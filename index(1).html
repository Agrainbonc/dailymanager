let canvasFullscreen=false,fullscreenViewport=null;
let selected=null,selectedEdge=null,view='canvas',connectionFrom=null,history=[],future=[],gesture=null,spaceDown=false,saveTimer=null,lastSaved='',currentViewport={x:0,y:0,z:1},searchText='',filter='all',miniBounds=null;
const flow=()=>state.flows.find(f=>f.id===state.active)||state.flows[0];
function validate(data){if(!data||data.version!==1||!Array.isArray(data.flows)||!data.flows.length||data.flows.length>200)throw Error('备份格式不正确');const ids=new Set();for(const f of data.flows){if(!f||typeof f.id!=='string'||ids.has(f.id)||typeof f.name!=='string'||!f.name.trim()||f.name.length>30||!Array.isArray(f.nodes)||!Array.isArray(f.edges)||f.nodes.length>3000||f.edges.length>10000)throw Error('任务流格式不正确');ids.add(f.id);f.description=String(f.description||'').slice(0,2000);f.color=Number.isInteger(f.color)&&palette[f.color]?f.color:0;const ns=new Set();for(const n of f.nodes){if(!n||typeof n.id!=='string'||ns.has(n.id)||typeof n.title!=='string'||[...n.title].length<2||[...n.title].length>10||!Number.isFinite(n.x)||!Number.isFinite(n.y)||Math.abs(n.x)>1e7||Math.abs(n.y)>1e7)throw Error('任务节点格式不正确');ns.add(n.id);n.description=String(n.description||'').slice(0,50000);n.assignee=String(n.assignee||'').slice(0,100);n.color=Number.isInteger(n.color)&&palette[n.color]?n.color:0;n.owner=owners[n.owner]?n.owner:'self';n.status=statuses[n.status]?n.status:'todo';n.urgency=levels[n.urgency]?n.urgency:'medium';n.importance=levels[n.importance]?n.importance:'medium';for(const key of ['start','end']){if(!n[key])n[key]='';else if(!/^\d{4}-\d{2}-\d{2}$/.test(n[key])||Number.isNaN(Date.parse(n[key]+'T00:00:00')))throw Error('日期格式不正确')}if(n.start&&n.end&&n.end<n.start)throw Error('任务日期范围不正确')}const es=new Set();for(const e of f.edges){if(!e||typeof e.id!=='string'||es.has(e.id)||!ns.has(e.from)||!ns.has(e.to)||e.from===e.to)throw Error('任务连线格式不正确');es.add(e.id);e.label=String(e.label||'').slice(0,100)}f.viewport=f.viewport&&[f.viewport.x,f.viewport.y,f.viewport.z].every(Number.isFinite)&&f.viewport.z>=.2&&f.viewport.z<=2?f.viewport:null}if(!ids.has(data.active))data.active=data.flows[0].id;return data}

function nodeHTML(n,index){const c=palette[n.color];return `<article class="node ${n.status} ${selected===n.id?'selected':''} ${matches(n)?'':'dimmed'}" data-node="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;--accent:${c.accent};--tint:${c.tint}" tabindex="0" role="button" aria-label="编辑任务：${esc(n.title)}"><button class="port in ${connectionFrom?'active':''}" data-port="in" title="连接到此任务" aria-label="连接到${esc(n.title)}"></button><div class="node-top"><span class="node-type"><span class="type-square"></span>${n.importance==='high'?'关键里程碑':n.owner==='delegate'?'协作任务':'任务节点'}</span><span class="node-tools"><span class="node-number">${String(index+1).padStart(2,'0')}</span><button class="node-menu" data-edit title="编辑任务">${icon('more',15)}</button></span></div><div class="node-body"><div class="node-title"><button class="status-check" data-check title="${n.status==='done'?'标记为未完成':'标记为已完成'}" aria-label="${n.status==='done'?'标记未完成':'完成任务'}">${n.status==='done'?icon('check',11):''}</button>${esc(n.title)}</div><div class="node-description">${esc(n.description||'点击补充这个任务的具体内容…')}</div><div class="node-tags"><span class="tag owner">${icon(n.owner==='delegate'?'branch':'home',9)}${owners[n.owner]}${n.owner==='delegate'&&n.assignee?' · '+esc(n.assignee):''}</span>${n.urgency==='high'?'<span class="tag urgent">紧急</span>':''}${n.importance==='high'?'<span class="tag important">重要</span>':''}</div></div><div class="node-footer"><span class="node-date">${icon('calendar',11)}${dateLabel(n)}</span><span class="node-status"><span class="status-dot"></span>${statuses[n.status]}</span></div><button class="port out ${connectionFrom===n.id?'active':''}" data-port="out" title="从此任务连线" aria-label="从${esc(n.title)}创建连线"></button><button class="branch-add" data-branch title="添加后续分支" aria-label="添加后续任务">${icon('plus',12)}</button></article>`}

$('canvas').addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==1)return;const nodeEl=e.target.closest('[data-node]'),edge=e.target.closest('[data-edge]');if(e.target.closest('button')||edge||view!=='canvas')return;if(!commitEditor())return;const isPan=!nodeEl||spaceDown||e.button===1;gesture={kind:isPan?'pan':'node',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,v:{...currentViewport},id:nodeEl?.dataset.node};if(!isPan){const n=flow().nodes.find(n=>n.id===gesture.id);gesture.x=n.x;gesture.y=n.y;gesture.before=snapshot()}else $('canvas').classList.add('panning');$('canvas').setPointerCapture(e.pointerId);e.preventDefault()});
$('canvas').addEventListener('pointermove',e=>{if(!gesture)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(!gesture.moved&&Math.hypot(dx,dy)<4)return;if(!gesture.moved&&gesture.kind==='node'){history.push(gesture.before);if(history.length>60)history.shift();future=[];selected=gesture.id;selectedEdge=null;renderInspector()}gesture.moved=true;if(gesture.kind==='pan'){currentViewport.x=gesture.v.x+dx;currentViewport.y=gesture.v.y+dy;applyViewport()}else{const n=flow().nodes.find(n=>n.id===gesture.id);n.x=Math.round(gesture.x+dx/currentViewport.z);n.y=Math.round(gesture.y+dy/currentViewport.z);const el=Array.from($('nodes').children).find(el=>el.dataset.node===n.id);el.style.left=n.x+'px';el.style.top=n.y+'px';el.classList.add('dragging');renderEdges();renderMini()}});
function endGesture(e){if(!gesture)return;const g=gesture;gesture=null;$('canvas').classList.remove('panning');if($('canvas').hasPointerCapture(e.pointerId))$('canvas').releasePointerCapture(e.pointerId);if(g.moved){if(g.kind==='node'){changed();renderBoard()}else saveViewport()}else if(g.kind==='node')selectNode(g.id);else{selected=null;selectedEdge=null;connectionFrom=null;renderInspector();renderBoard()}}
$('canvas').addEventListener('pointerup',endGesture);$('canvas').addEventListener('pointercancel',endGesture);
$('canvas').addEventListener('click',e=>{const nodeEl=e.target.closest('[data-node]');if(nodeEl){const id=nodeEl.dataset.node,n=flow().nodes.find(n=>n.id===id);if(e.target.closest('[data-port]')){if(!commitEditor())return;const port=e.target.closest('[data-port]').dataset.port;if(port==='out'){connectionFrom=id;selectedEdge=null;renderBoard()}else if(connectionFrom)connect(connectionFrom,id);else toast('先点击前一个任务右侧的圆点，再连接到这里');return}if(e.target.closest('[data-branch]'))return addNode(id);if(e.target.closest('[data-check]')){if(!commitEditor())return;checkpoint();n.status=n.status==='done'?'todo':'done';changed();renderAll();return}if(e.target.closest('[data-edit]'))selectNode(id)}const edge=e.target.closest('[data-edge]');if(edge){if(!commitEditor())return;selected=null;selectedEdge=edge.dataset.edge;connectionFrom=null;renderInspector();renderBoard()}});
$('canvas').addEventListener('dblclick',e=>{if(!e.target.closest('[data-node],[data-edge]'))addNode()});
$('canvas').addEventListener('wheel',e=>{e.preventDefault();const r=$('canvas').getBoundingClientRect();zoomAt(currentViewport.z*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('nodes').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node]')){e.preventDefault();selectNode(e.target.dataset.node)}});
$('timeline').addEventListener('click',e=>{const el=e.target.closest('[data-time-node]');if(el)selectNode(el.dataset.timeNode)});$('timeline').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-time-node]')){e.preventDefault();selectNode(e.target.dataset.timeNode)}});
$('minimap').onclick=e=>{const r=$('minimap').getBoundingClientRect(),b=miniBounds;if(!b)return;const scale=Math.min(r.width/b.w,r.height/b.h),offX=(r.width-b.w*scale)/2,offY=(r.height-b.h*scale)/2;const x=b.x+(e.clientX-r.left-offX)/scale,y=b.y+(e.clientY-r.top-offY)/scale;currentViewport.x=$('canvas').clientWidth/2-x*currentViewport.z;currentViewport.y=$('canvas').clientHeight/2-y*currentViewport.z;applyViewport();saveViewport()};
$('flowList').onclick=e=>{const b=e.target.closest('[data-flow]');if(b)switchFlow(b.dataset.flow)};$('newFlow').onclick=$('newFlowTop').onclick=()=>flowDialog();$('addNode').onclick=()=>addNode();$('undo').onclick=()=>restore('undo');$('redo').onclick=()=>restore('redo');$('fit').onclick=fitBoard;$('zoomIn').onclick=()=>zoomAt(currentViewport.z*1.2);$('zoomOut').onclick=()=>zoomAt(currentViewport.z/1.2);$('zoomLabel').onclick=()=>zoomAt(1);$('help').onclick=$('helpSide').onclick=help;
$('canvasView').onclick=()=>{if(!commitEditor())return;view='canvas';updateView();applyViewport()};$('timeView').onclick=()=>{if(!commitEditor())return;view='time';connectionFrom=null;selectedEdge=null;renderTimeline();updateView()};
$('search').oninput=e=>{searchText=e.target.value;renderBoard();renderTimeline();if(searchText)toastSearch()};let searchToastTimer;function toastSearch(){clearTimeout(searchToastTimer);searchToastTimer=setTimeout(()=>{if(searchText&&view==='canvas'&&!flow().nodes.some(matches))toast('没有找到匹配任务，试试其他关键词')},700)}
$('filter').onchange=e=>{filter=e.target.value;renderBoard();renderTimeline();if(view==='canvas'&&filter!=='all')toast(`符合条件的任务已高亮（${flow().nodes.filter(matches).length} 项）`)};
$('dataMenu').onclick=e=>{e.stopPropagation();showMenu($('dataMenu'),[{label:'导出全部任务流 JSON',icon:'export',run:exportBackup},{label:'导出当前画布 SVG',icon:'workflow',run:exportSVG},{label:'导入备份文件',icon:'import',run:()=>$('importInput').click()}])};
$('flowMenu').onclick=e=>{e.stopPropagation();showMenu($('flowMenu'),[{label:'编辑任务流',icon:'edit',run:()=>flowDialog(true)},{label:'复制当前任务流',icon:'copy',run:()=>{if(!commitEditor())return;checkpoint();const original=flow(),clone=JSON.parse(JSON.stringify(original)),map=new Map();clone.id=uid();clone.name=(clone.name.slice(0,16)+'（副本）');clone.nodes.forEach(n=>{const old=n.id;n.id=uid();map.set(old,n.id)});clone.edges.forEach(e=>{e.id=uid();e.from=map.get(e.from);e.to=map.get(e.to)});state.flows.push(clone);switchFlow(clone.id);changed();toast('已复制任务流')}},{label:'删除当前任务流',icon:'trash',run:()=>{if(state.flows.length===1){toast('请至少保留一套任务流');return}if(!commitEditor())return;const id=flow().id;openConfirm('删除这套任务流？',`「${flow().name}」中的全部任务与连线都会被删除。可使用撤销恢复。`,()=>{checkpoint();state.flows=state.flows.filter(f=>f.id!==id);state.active=state.flows[0].id;selected=null;selectedEdge=null;connectionFrom=null;currentViewport=flow().viewport||{x:0,y:0,z:1};renderAll();if(!flow().viewport)fitBoard();changed()},'删除任务流')}}])};
$('importInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>20*1024*1024){toast('备份文件过大，请使用 20 MB 以内的 JSON 文件');return}try{const incoming=validate(JSON.parse(await file.text()));if(!commitEditor())return;openConfirm('导入任务流备份？',`备份包含 ${incoming.flows.length} 套任务流。导入后会替换当前数据，可使用撤销恢复。`,()=>{checkpoint();state=incoming;selected=null;selectedEdge=null;connectionFrom=null;searchText='';filter='all';$('search').value='';$('filter').value='all';currentViewport=flow().viewport||{x:0,y:0,z:1};renderAll();if(!flow().viewport)fitBoard();changed();toast('备份已恢复')},'导入备份')}catch(err){toast('无法导入：'+err.message)}};
document.addEventListener('click',e=>{if(!e.target.closest('.menu')&&!e.target.closest('#flowMenu,#dataMenu'))$('menuRoot').innerHTML=''});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(e.key==='Escape'){if($('modalRoot').children.length){closeModal();return}$('menuRoot').innerHTML='';if(!commitEditor())return;if(canvasFullscreen&&!connectionFrom&&!selectedEdge&&!selected){setCanvasFullscreen(false);return}connectionFrom=null;selectedEdge=null;selected=null;renderInspector();renderBoard();return}if($('modalRoot').children.length)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(commitEditor())toast(persist()?'已保存到当前浏览器':'本地保存不可用，请导出 JSON 备份');return}if(typing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();restore(e.shiftKey?'redo':'undo')}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();restore('redo')}else if(e.key==='Delete'||e.key==='Backspace'){if(selectedEdge){e.preventDefault();deleteEdge()}else if(selected){e.preventDefault();requestDeleteNode()}}else if(e.code==='Space'){e.preventDefault();spaceDown=true;$('canvas').style.cursor='grab'}});document.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});window.addEventListener('blur',()=>{spaceDown=false});
window.addEventListener('beforeunload',()=>{commitEditor();persist()});new ResizeObserver(()=>{if(view==='canvas')applyViewport()}).observe($('canvas'));
renderAll();requestAnimationFrame(()=>{if(flow().viewport){currentViewport={...flow().viewport};applyViewport()}else initialView()});if(loadWarning)toast(loadWarning);persist();
</script>
